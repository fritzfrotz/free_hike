apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// P10.C1: release signing. The keystore and its properties file live in a
// signing folder outside the repo: $FREEHIKE_SIGNING_PROPERTIES, else
// .freehike-signing/release.properties under the user home. The properties
// file holds storeFile (relative to its own folder), storePassword, keyAlias
// and keyPassword; no tracked file carries any of them (janitor signing pass).
def signingPropsFile = file(System.getenv('FREEHIKE_SIGNING_PROPERTIES')
        ?: new File(System.getProperty('user.home'), '.freehike-signing/release.properties').path)
def signingKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def signingProps = new Properties()
if (signingPropsFile.isFile()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def signingReady = signingKeys.every { signingProps.getProperty(it) }

android {
    namespace = "com.freehike.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.freehike.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // DL-006: versionCode = major*10000 + minor*100 + patch.
        versionCode 100
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile new File(signingPropsFile.parentFile, signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (signingReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// A release build never comes out unsigned: without a complete signing
// properties file, any release packaging task fails here, naming the
// missing keys (never a value). Debug builds need no signing folder.
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find {
        it.project == project && it.name ==~ /(assemble|bundle|package)Release/
    }
    if (releaseTask != null && !signingReady) {
        def missing = signingKeys.findAll { !signingProps.getProperty(it) }
        throw new GradleException(
            "Release signing (P10.C1): ${signingPropsFile.isFile() ? 'properties file lacks ' + missing.join(', ') : 'no properties file at ' + signingPropsFile}"
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // JNA (AAR packaging): required by the UniFFI-generated Kotlin bindings,
    // which bind libfreehike_ffi.so via com.sun.jna.Native.load.
    implementation "net.java.dev.jna:jna:5.17.0@aar"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // P8.C3: background compile windows — CoroutineWorker + FGS promotion
    // (setForeground/dataSync). ktx flavor pulls kotlinx-coroutines.
    implementation "androidx.work:work-runtime-ktx:$androidxWorkVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
